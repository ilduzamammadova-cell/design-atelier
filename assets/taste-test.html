<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taste Test</title>
<style>
  :root {
    --paper: #f4f1ea; --surface: #fbfaf6; --ink: #1b1a17; --muted: #625f58;
    --line: #d6d0c3; --accent: #b4410f; --on-accent: #ffffff;
    --space: 8px; --radius: 2px;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #181715; --surface: #201f1c; --ink: #ece8df; --muted: #a8a397;
      --line: #3a3832; --accent: #f08a4b; --on-accent: #181715;
    }
  }
  :root[data-theme="dark"] {
    --paper: #181715; --surface: #201f1c; --ink: #ece8df; --muted: #a8a397;
    --line: #3a3832; --accent: #f08a4b; --on-accent: #181715;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--font); }
  main { max-width: 960px; margin: 0 auto; padding: calc(var(--space) * 4) 16px calc(var(--space) * 8); }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: calc(var(--space) * 2); margin-bottom: calc(var(--space) * 4); }
  h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .meta { font: 13px/1 var(--mono); color: var(--muted); }
  .lang { background: none; border: 1px solid var(--line); color: var(--ink); font: 12px/1 var(--mono); padding: 6px 8px; border-radius: var(--radius); cursor: pointer; }
  .intro p { max-width: 56ch; margin: 0 0 calc(var(--space) * 3); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--space) * 2); }
  @media (max-width: 600px) { .pair { grid-template-columns: 1fr; } }
  .option { appearance: none; border: 1px solid var(--line); background: var(--surface); padding: 0; cursor: pointer; border-radius: var(--radius); display: block; width: 100%; transition: border-color 120ms, transform 120ms; }
  .option:hover { border-color: var(--ink); }
  .option:active { transform: translateY(1px); }
  .option svg { display: block; width: 100%; height: auto; }
  .option .key { display: block; text-align: left; font: 12px/1 var(--mono); color: var(--muted); padding: 10px 12px; border-top: 1px solid var(--line); }
  .row { display: flex; flex-wrap: wrap; gap: var(--space); margin-top: calc(var(--space) * 2); }
  .btn { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 14px/1 var(--font); padding: 12px 16px; min-height: 44px; border-radius: var(--radius); cursor: pointer; }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn[disabled] { opacity: .4; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .progress { height: 2px; background: var(--line); margin-bottom: calc(var(--space) * 3); }
  .progress > i { display: block; height: 100%; background: var(--ink); width: 0; transition: width 220ms; }
  .results h2 { font-size: 18px; margin: 0 0 calc(var(--space) * 2); }
  .axis { display: grid; grid-template-columns: 9.5em 1fr 2.5em; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .axis .label { font-family: var(--mono); font-size: 13px; }
  .axis .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .track { position: relative; height: 2px; background: var(--line); }
  .track b { position: absolute; top: -5px; width: 12px; height: 12px; margin-left: -6px; background: var(--ink); border-radius: 50%; }
  .axis .val { font-family: var(--mono); text-align: right; }
  pre { background: var(--surface); border: 1px solid var(--line); padding: 12px; overflow-x: auto; font: 13px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; border-radius: var(--radius); }
  .hint { color: var(--muted); font-size: 14px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-t="title">Taste test</h1>
    <div style="display:flex;gap:12px;align-items:center">
      <span class="meta" id="count" aria-live="polite"></span>
      <button class="lang" id="lang" type="button">AZ</button>
    </div>
  </header>
  <section id="app"></section>
</main>
<script>
/* ---------- i18n ---------- */
const T = {
  en: { title: "Taste test", intro: "24 pairs of small compositions. For each pair, pick the one you are drawn to — quickly, without reasoning. There are no right answers; instinct is the point.", keys: "Keys: ← left · → right · B both · N neither · Backspace back", start: "Start", left: "Left", right: "Right", both: "Both", neither: "Neither", back: "Back", result: "Your Style DNA vector", paste: "Paste the first line back into the conversation.", copy: "Copy", copied: "Copied", restart: "Start again", of: "of" },
  az: { title: "Zövq testi", intro: "24 cüt kiçik kompozisiya. Hər cütdə səni cəlb edəni seç — tez, düşünmədən. Düzgün cavab yoxdur; məqsəd instinktdir.", keys: "Düymələr: ← sol · → sağ · B hər ikisi · N heç biri · Backspace geri", start: "Başla", left: "Sol", right: "Sağ", both: "Hər ikisi", neither: "Heç biri", back: "Geri", result: "Sənin Stil DNT vektorun", paste: "Birinci sətri kopyalayıb söhbətə yapışdır.", copy: "Kopyala", copied: "Kopyalandı", restart: "Yenidən başla", of: "/" }
};
const AXES = ["order","density","ornament","warmth","contrast","geometry","chroma","typevoice","energy","hand","play","era"];
const ENDS = {
  en: { order:["free","systematic"], density:["airy","dense"], ornament:["bare","decorated"], warmth:["cool","warm"], contrast:["soft","stark"], geometry:["organic","geometric"], chroma:["muted","saturated"], typevoice:["quiet type","type as image"], energy:["still","kinetic"], hand:["machine","handmade"], play:["serious","playful"], era:["traditional","futurist"] },
  az: { order:["sərbəst","sistemli"], density:["havalı","sıx"], ornament:["sadə","bəzəkli"], warmth:["soyuq","isti"], contrast:["yumşaq","kəskin"], geometry:["orqanik","həndəsi"], chroma:["solğun","rəngarəng"], typevoice:["sakit şrift","şrift obraz kimi"], energy:["sakit","dinamik"], hand:["maşın","əl işi"], play:["ciddi","oyunbaz"], era:["ənənəvi","futurist"] }
};
let lang = (navigator.language || "en").toLowerCase().startsWith("az") ? "az" : "en";
try { const s = localStorage.getItem("tt-lang"); if (s) lang = s; } catch (e) {}

/* ---------- drawing helpers ---------- */
const W = 240, H = 180;
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
const svg = (inner, bg = "#f4f1ea") => `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="${W}" height="${H}" fill="${bg}"/>${inner}</svg>`;
const INK = "#1b1a17";
function wobble(cx, cy, r, seed, amp = 4, n = 48) {
  // low-frequency wobble, like a hand-drawn line, not noise
  const R = rng(seed), p1 = R() * 6.28, p2 = R() * 6.28, p3 = R() * 6.28; let d = "";
  for (let i = 0; i <= n; i++) { const a = (i / n) * Math.PI * 2; const rr = r + Math.sin(a * 2 + p1) * amp + Math.sin(a * 3 + p2) * amp * .6 + Math.sin(a * 5 + p3) * amp * .25; d += (i ? "L" : "M") + (cx + Math.cos(a) * rr).toFixed(1) + " " + (cy + Math.sin(a) * rr).toFixed(1); }
  return d + "Z";
}
function seg(x, y, s, digit) {
  const map = { "0":"abcdef", "1":"bc", "4":"bcfg", "8":"abcdefg", "2":"abged", "9":"abcdfg" };
  const w = s, h = s * 2, segs = { a:[x,y,x+w,y], b:[x+w,y,x+w,y+h/2], c:[x+w,y+h/2,x+w,y+h], d:[x,y+h,x+w,y+h], e:[x,y+h/2,x,y+h], f:[x,y,x,y+h/2], g:[x,y+h/2,x+w,y+h/2] };
  return [...map[digit]].map(k => { const [a,b,c,d] = segs[k]; return `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#d9f2ff" stroke-width="4" stroke-linecap="square"/>`; }).join("");
}

/* ---------- 24 pairs: low pole vs high pole of one axis ---------- */
const PAIRS = [
 { axis:"order", low:{desc:"squares scattered at free angles", draw:()=>{const r=rng(7);let s="";for(let i=0;i<9;i++){const x=18+r()*176,y=14+r()*126,a=(r()-.5)*70;s+=`<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="28" height="28" fill="${INK}" transform="rotate(${a.toFixed(0)} ${(x+14).toFixed(0)} ${(y+14).toFixed(0)})"/>`;}return svg(s);}},
   high:{desc:"the same squares locked in a 3×3 grid", draw:()=>{let s="";for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=`<rect x="${66+j*40}" y="${36+i*40}" width="28" height="28" fill="${INK}"/>`;return svg(s);}} },
 { axis:"density", low:{desc:"one small mark in a large empty field", draw:()=>svg(`<rect x="44" y="116" width="22" height="22" fill="${INK}"/>`)},
   high:{desc:"a field packed with small marks", draw:()=>{let s="";for(let i=0;i<8;i++)for(let j=0;j<12;j++)s+=`<rect x="${12+j*18.5}" y="${12+i*20}" width="${12+((i*7+j*3)%5)}" height="12" fill="${INK}"/>`;return svg(s);}} },
 { axis:"ornament", low:{desc:"a plain frame", draw:()=>svg(`<rect x="40" y="30" width="160" height="120" fill="none" stroke="${INK}" stroke-width="2"/>`)},
   high:{desc:"a frame with patterned borders and corner ornaments", draw:()=>{let z="M40 30";for(let i=0;i<16;i++)z+=` L${45+i*10} ${i%2?30:22}`;let z2="M40 150";for(let i=0;i<16;i++)z2+=` L${45+i*10} ${i%2?150:158}`;let d="";for(let i=0;i<10;i++)d+=`<circle cx="32" cy="${38+i*12}" r="2.5" fill="#7a2e1d"/><circle cx="208" cy="${38+i*12}" r="2.5" fill="#7a2e1d"/>`;return svg(`<rect x="40" y="30" width="160" height="120" fill="none" stroke="${INK}" stroke-width="2"/><rect x="52" y="42" width="136" height="96" fill="none" stroke="#7a2e1d" stroke-width="1"/><path d="${z}" fill="none" stroke="${INK}" stroke-width="1.5"/><path d="${z2}" fill="none" stroke="${INK}" stroke-width="1.5"/>${d}<path d="M120 62 C135 75 135 105 120 118 C105 105 105 75 120 62Z" fill="#7a2e1d"/><circle cx="120" cy="90" r="5" fill="#f4f1ea"/>`);}} },
 { axis:"warmth", low:{desc:"cool greys, sharp thin forms", draw:()=>svg(`<rect x="40" y="40" width="70" height="100" fill="#5b6b7a"/><rect x="122" y="40" width="78" height="46" fill="#9aa7b3"/><rect x="122" y="96" width="78" height="2" fill="#5b6b7a"/><rect x="122" y="108" width="50" height="2" fill="#5b6b7a"/>`,"#e7ebee")},
   high:{desc:"warm earth tones, soft rounded forms", draw:()=>svg(`<rect x="36" y="40" width="74" height="100" rx="18" fill="#c0643b"/><circle cx="160" cy="70" r="34" fill="#e0a458"/><rect x="124" y="114" width="76" height="26" rx="13" fill="#8a3b1e"/>`,"#f3e6d3")} },
 { axis:"contrast", low:{desc:"close tonal values, gentle", draw:()=>svg(`<rect x="30" y="30" width="110" height="120" fill="#a8a398"/><circle cx="160" cy="96" r="44" fill="#c9c4b9"/>`,"#b9b4aa")},
   high:{desc:"pure black against pure white", draw:()=>svg(`<rect x="0" y="0" width="128" height="180" fill="#000"/><circle cx="172" cy="96" r="30" fill="#000"/><rect x="34" y="120" width="60" height="8" fill="#fff"/>`,"#ffffff")} },
 { axis:"geometry", low:{desc:"soft organic blobs", draw:()=>svg(`<path d="M60 50 C95 20 130 60 115 95 C100 135 50 140 40 110 C30 80 40 65 60 50Z" fill="${INK}"/><path d="M160 70 C190 60 210 90 196 118 C182 146 140 140 140 112 C140 90 145 75 160 70Z" fill="#6b6455"/>`)},
   high:{desc:"squares, triangles, half-circles", draw:()=>svg(`<rect x="34" y="50" width="70" height="70" fill="${INK}"/><path d="M120 120 L160 50 L200 120Z" fill="#6b6455"/><path d="M118 150 A30 30 0 0 1 178 150Z" fill="${INK}"/>`)} },
 { axis:"chroma", low:{desc:"a monochrome range", draw:()=>svg(["#2b2b2b","#555","#808080","#ababab","#d6d6d6"].map((c,i)=>`<rect x="${30+i*36}" y="30" width="32" height="120" fill="${c}"/>`).join(""))},
   high:{desc:"many saturated colors together", draw:()=>svg(["#e63946","#f4a300","#2a9d8f","#3a0ca3","#ff6fb5"].map((c,i)=>`<rect x="${30+i*36}" y="30" width="32" height="120" fill="${c}"/>`).join(""))} },
 { axis:"typevoice", low:{desc:"an image leads, small neutral caption", draw:()=>svg(`<rect x="30" y="24" width="180" height="104" fill="#8d877a"/><path d="M30 128 L90 70 L130 108 L160 84 L210 128Z" fill="#5f5a50"/><text x="30" y="150" font-family="system-ui,sans-serif" font-size="10" fill="${INK}">Fig. 3 — Evening, north ridge</text><rect x="30" y="158" width="120" height="2" fill="#bdb6a8"/>`)},
   high:{desc:"letterforms fill the frame", draw:()=>svg(`<text x="120" y="122" text-anchor="middle" font-family="Impact,'Arial Black',system-ui,sans-serif" font-weight="900" font-size="92" letter-spacing="-4" fill="${INK}">FORM</text>`)} },
 { axis:"energy", low:{desc:"calm horizontal bands", draw:()=>svg(`<rect x="0" y="40" width="240" height="18" fill="${INK}"/><rect x="0" y="82" width="240" height="18" fill="#6b6455"/><rect x="0" y="124" width="240" height="18" fill="${INK}"/>`)},
   high:{desc:"diagonals bursting outward", draw:()=>{let s="";for(let i=0;i<14;i++){const a=i/14*Math.PI*2,l=40+(i%3)*28;s+=`<line x1="120" y1="90" x2="${(120+Math.cos(a)*l).toFixed(0)}" y2="${(90+Math.sin(a)*l).toFixed(0)}" stroke="${i%2?INK:"#c2410c"}" stroke-width="${3+(i%4)*2}"/>`;}return svg(s);}} },
 { axis:"hand", low:{desc:"perfect machine-drawn shapes", draw:()=>svg(`<circle cx="84" cy="90" r="44" fill="none" stroke="${INK}" stroke-width="3"/><rect x="138" y="52" width="72" height="72" fill="none" stroke="${INK}" stroke-width="3"/>`)},
   high:{desc:"hand-drawn wobbly shapes with texture", draw:()=>{const r=rng(11);let dots="";for(let i=0;i<90;i++)dots+=`<circle cx="${(r()*240).toFixed(0)}" cy="${(r()*180).toFixed(0)}" r="${(r()*1.2+.3).toFixed(1)}" fill="#3b352c" opacity=".35"/>`;return svg(`${dots}<path d="${wobble(84,90,44,3,3)}" fill="none" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/><path d="M140 54 L208 50 L212 122 L136 126 Z" fill="none" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>`,"#efe8d8");}} },
 { axis:"play", low:{desc:"a formal, document-like layout", draw:()=>svg(`<rect x="30" y="28" width="180" height="10" fill="${INK}"/><rect x="30" y="46" width="180" height="1" fill="${INK}"/>${[0,1,2,3,4,5].map(i=>`<rect x="30" y="${58+i*12}" width="84" height="4" fill="#6b6455"/><rect x="126" y="${58+i*12}" width="84" height="4" fill="#6b6455"/>`).join("")}<circle cx="190" cy="144" r="14" fill="none" stroke="${INK}" stroke-width="2"/>`)},
   high:{desc:"bouncy tilted shapes with a wink", draw:()=>svg(`<circle cx="70" cy="110" r="38" fill="#f4a300"/><circle cx="58" cy="102" r="5" fill="${INK}"/><path d="M76 102 h10" stroke="${INK}" stroke-width="4" stroke-linecap="round"/><path d="M58 122 Q72 134 88 120" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/><rect x="132" y="40" width="54" height="54" fill="#e63946" transform="rotate(18 159 67)"/><circle cx="196" cy="134" r="16" fill="#2a9d8f"/><circle cx="160" cy="150" r="8" fill="${INK}"/>`)} },
 { axis:"era", low:{desc:"an old book page: serif, rule, ornament", draw:()=>svg(`<text x="120" y="62" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="24" fill="#2b2118">Chapter I</text><path d="M60 78 H112 M128 78 H180" stroke="#2b2118" stroke-width="1"/><path d="M120 72 L126 78 L120 84 L114 78Z" fill="#2b2118"/><text x="44" y="122" font-family="Georgia,serif" font-size="34" fill="#7a2e1d">T</text>${[0,1,2,3].map(i=>`<rect x="${i<2?70:44}" y="${100+i*12}" width="${i<2?126:152}" height="3" fill="#6b5a48"/>`).join("")}`,"#efe4cc")},
   high:{desc:"a wireframe horizon and machine numerals", draw:()=>{let g="";for(let i=0;i<9;i++)g+=`<line x1="120" y1="96" x2="${-80+i*50}" y2="180" stroke="#5aa9c9" stroke-width="1"/>`;for(let i=0;i<5;i++){const y=104+i*i*4;g+=`<line x1="0" y1="${y}" x2="240" y2="${y}" stroke="#5aa9c9" stroke-width="1"/>`;}return svg(`${g}${seg(66,30,16,"2")}${seg(92,30,16,"0")}${seg(126,30,16,"9")}${seg(152,30,16,"1")}`,"#0d1418");}} },

 { axis:"order", low:{desc:"lines of text placed freely, overlapping", draw:()=>{const r=rng(5);let s=`<rect x="22" y="24" width="120" height="10" fill="${INK}" transform="rotate(-8 82 29)"/>`;for(let i=0;i<8;i++){const x=10+r()*120,y=50+r()*110,w=40+r()*80,a=(r()-.5)*28;s+=`<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${w.toFixed(0)}" height="4" fill="#4a453c" transform="rotate(${a.toFixed(0)} ${x.toFixed(0)} ${y.toFixed(0)})"/>`;}return svg(s);}},
   high:{desc:"text set in two aligned columns", draw:()=>{let s=`<rect x="24" y="24" width="120" height="10" fill="${INK}"/>`;const w=[80,74,82,68,80,76,60];for(let i=0;i<7;i++){s+=`<rect x="24" y="${52+i*14}" width="${w[i]}" height="4" fill="#4a453c"/><rect x="128" y="${52+i*14}" width="${w[(i+3)%7]}" height="4" fill="#4a453c"/>`;}return svg(s);}} },
 { axis:"density", low:{desc:"one headline, wide margins", draw:()=>svg(`<rect x="48" y="78" width="110" height="12" fill="${INK}"/><rect x="48" y="98" width="60" height="4" fill="#6b6455"/>`)},
   high:{desc:"three dense columns of text", draw:()=>{let s=`<rect x="12" y="12" width="216" height="12" fill="${INK}"/>`;for(let c=0;c<3;c++)for(let i=0;i<19;i++)s+=`<rect x="${12+c*74}" y="${32+i*7.5}" width="${64-((i*5+c*3)%9)}" height="3" fill="#4a453c"/>`;return svg(s);}} },
 { axis:"ornament", low:{desc:"a bare circle", draw:()=>svg(`<circle cx="120" cy="90" r="46" fill="${INK}"/>`)},
   high:{desc:"a circle wreathed in petals and dots", draw:()=>{let s="";for(let i=0;i<12;i++){const a=i*30;s+=`<ellipse cx="120" cy="40" rx="9" ry="20" fill="#7a2e1d" transform="rotate(${a} 120 90)"/>`;}for(let i=0;i<24;i++){const a=i/24*Math.PI*2;s+=`<circle cx="${(120+Math.cos(a)*76).toFixed(1)}" cy="${(90+Math.sin(a)*76).toFixed(1)}" r="2.5" fill="${INK}"/>`;}return svg(s+`<circle cx="120" cy="90" r="30" fill="${INK}"/><circle cx="120" cy="90" r="12" fill="#e0a458"/>`);}} },
 { axis:"warmth", low:{desc:"technical labels on cool ground", draw:()=>svg(`<line x1="120" y1="20" x2="120" y2="160" stroke="#8796a5"/><line x1="40" y1="90" x2="200" y2="90" stroke="#8796a5"/><circle cx="120" cy="90" r="30" fill="none" stroke="#4a5866" stroke-width="1.5"/><text x="28" y="40" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#4a5866">UNIT_04 / SYS</text><text x="134" y="152" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#4a5866">x=120 y=090</text>`,"#e7ebee")},
   high:{desc:"intimate italic serif on warm cream", draw:()=>svg(`<circle cx="176" cy="56" r="26" fill="#e0a458"/><text x="32" y="104" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="30" fill="#8a3b1e">for you,</text><text x="32" y="138" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="30" fill="#8a3b1e">always</text>`,"#f6ead8")} },
 { axis:"contrast", low:{desc:"three words at the same size", draw:()=>svg(`<text x="34" y="80" font-family="system-ui,sans-serif" font-size="22" fill="${INK}">Aa</text><text x="100" y="80" font-family="system-ui,sans-serif" font-size="22" fill="${INK}">Aa</text><text x="166" y="80" font-family="system-ui,sans-serif" font-size="22" fill="${INK}">Aa</text><text x="34" y="120" font-family="system-ui,sans-serif" font-size="22" fill="${INK}">Aa</text><text x="100" y="120" font-family="system-ui,sans-serif" font-size="22" fill="${INK}">Aa</text><text x="166" y="120" font-family="system-ui,sans-serif" font-size="22" fill="${INK}">Aa</text>`)},
   high:{desc:"one giant letter beside tiny text", draw:()=>svg(`<text x="10" y="166" font-family="Georgia,serif" font-size="190" fill="${INK}">A</text><text x="170" y="164" font-family="system-ui,sans-serif" font-size="9" fill="${INK}">a, small.</text>`)} },
 { axis:"geometry", low:{desc:"a flowing wave", draw:()=>svg(`<path d="M10 100 C40 40 70 40 100 90 S160 150 190 80 S225 60 232 70" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`)},
   high:{desc:"a ruled zig-zag at 45°", draw:()=>svg(`<path d="M10 120 L50 80 L90 120 L130 80 L170 120 L210 80 L230 100" fill="none" stroke="${INK}" stroke-width="5" stroke-linejoin="miter"/>`)} },
 { axis:"chroma", low:{desc:"dusty, greyed tones", draw:()=>svg(`<circle cx="72" cy="90" r="40" fill="#9c8f84"/><circle cx="130" cy="90" r="40" fill="#b5a99c" opacity=".9"/><circle cx="182" cy="90" r="34" fill="#7f8a83"/>`,"#e9e5de")},
   high:{desc:"vivid primaries", draw:()=>svg(`<circle cx="72" cy="90" r="40" fill="#e10600"/><circle cx="130" cy="90" r="40" fill="#ffd500"/><circle cx="182" cy="90" r="34" fill="#0047ab"/>`,"#ffffff")} },
 { axis:"typevoice", low:{desc:"a quiet paragraph", draw:()=>svg(`<text font-family="system-ui,sans-serif" font-size="11" fill="${INK}"><tspan x="36" y="70">A quiet paragraph sets the tone.</tspan><tspan x="36" y="86">It carries the words and steps</tspan><tspan x="36" y="102">aside, so the content can speak</tspan><tspan x="36" y="118">without any help from its type.</tspan></text>`)},
   high:{desc:"stacked expressive letters", draw:()=>svg(`<text x="22" y="120" font-family="Georgia,serif" font-weight="700" font-size="110" fill="${INK}" transform="rotate(-6 50 100)">L</text><text x="80" y="150" font-family="Georgia,serif" font-weight="700" font-size="76" fill="#c2410c">O</text><text x="132" y="96" font-family="ui-monospace,Menlo,monospace" font-weight="700" font-size="64" fill="${INK}">U</text><text x="176" y="160" font-family="Georgia,serif" font-style="italic" font-size="88" fill="${INK}">d</text>`)} },
 { axis:"energy", low:{desc:"a single still point", draw:()=>svg(`<circle cx="120" cy="90" r="10" fill="${INK}"/>`)},
   high:{desc:"parallel streaks racing diagonally", draw:()=>{let s="";for(let i=0;i<11;i++){const x=-20+i*24,l=50+(i*37%5)*16;s+=`<line x1="${x}" y1="${170-i*4}" x2="${x+l}" y2="${170-i*4-l*.8}" stroke="${i%3?INK:"#c2410c"}" stroke-width="${4+(i%3)*2}" stroke-linecap="round"/>`;}return svg(s);}} },
 { axis:"hand", low:{desc:"crisp, evenly spaced lines", draw:()=>{let s="";for(let i=0;i<8;i++)s+=`<line x1="30" y1="${40+i*14}" x2="210" y2="${40+i*14}" stroke="${INK}" stroke-width="3"/>`;return svg(s);}},
   high:{desc:"rough brush strokes", draw:()=>{const r=rng(19);let s="";for(let i=0;i<6;i++){const y=40+i*20;let top=`M${24+r()*8} ${y}`,bot="";const pts=[];for(let x=30;x<=214;x+=12){pts.push([x,y+(r()-.5)*4,4+r()*6]);}pts.forEach(p=>top+=` L${p[0]} ${(p[1]-p[2]/2).toFixed(1)}`);pts.reverse().forEach(p=>bot+=` L${p[0]} ${(p[1]+p[2]/2).toFixed(1)}`);s+=`<path d="${top}${bot}Z" fill="${INK}" opacity="${(.75+r()*.25).toFixed(2)}"/>`;}return svg(s,"#efe8d8");}} },
 { axis:"play", low:{desc:"a solemn centered title", draw:()=>svg(`<path d="M50 60 H190 M50 124 H190" stroke="${INK}" stroke-width="1"/><text x="120" y="90" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="20" letter-spacing="3" fill="${INK}">ANNUAL</text><text x="120" y="112" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" letter-spacing="4" fill="${INK}">REPORT · MMXXVI</text>`)},
   high:{desc:"a cheeky hand-set 'hi!' with a squiggle", draw:()=>svg(`<text x="46" y="122" font-family="'Comic Sans MS','Chalkboard SE','Marker Felt',system-ui,sans-serif" font-weight="700" font-size="76" fill="#3a0ca3" transform="rotate(-8 100 100)">hi!</text><path d="M150 140 q10 -16 20 0 t20 0 t20 0" fill="none" stroke="#e63946" stroke-width="5" stroke-linecap="round"/><circle cx="196" cy="48" r="10" fill="#f4a300"/>`)} },
 { axis:"era", low:{desc:"chunky wood-type letters on old paper", draw:()=>{const r=rng(23);let sp="";for(let i=0;i<60;i++)sp+=`<circle cx="${(30+r()*180).toFixed(0)}" cy="${(50+r()*80).toFixed(0)}" r="${(r()*1.6).toFixed(1)}" fill="#efe4cc"/>`;return svg(`<text x="120" y="126" text-anchor="middle" font-family="Rockwell,'Courier New',Georgia,serif" font-weight="700" font-size="84" fill="#2b2118">OLD</text>${sp}`,"#e8dcc0");}},
   high:{desc:"segmented digital forms on dark glass", draw:()=>svg(`${seg(40,50,24,"0")}${seg(78,50,24,"8")}<rect x="116" y="70" width="5" height="5" fill="#d9f2ff"/><rect x="116" y="100" width="5" height="5" fill="#d9f2ff"/>${seg(134,50,24,"4")}${seg(172,50,24,"1")}`,"#0d1418")} }
];

/* ---------- state ---------- */
let i = -1;
const answers = [];       // {axis, pick: "low"|"high"|"both"|"neither", lowSide}
const sides = PAIRS.map(() => Math.random() < .5 ? "L" : "R"); // which side shows the low pole

const app = document.getElementById("app");
const count = document.getElementById("count");
const t = k => T[lang][k];

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.getElementById("lang").textContent = lang === "en" ? "AZ" : "EN";
}

function renderIntro() {
  count.textContent = "";
  app.innerHTML = `<div class="intro"><p>${t("intro")}</p><p class="hint">${t("keys")}</p><button class="btn primary" id="start" type="button">${t("start")}</button></div>`;
  document.getElementById("start").onclick = () => { i = 0; renderPair(); };
  document.getElementById("start").focus();
}

function renderPair() {
  const p = PAIRS[i];
  const lowLeft = sides[i] === "L";
  const left = lowLeft ? p.low : p.high, right = lowLeft ? p.high : p.low;
  count.textContent = `${String(i + 1).padStart(2, "0")} ${t("of")} ${PAIRS.length}`;
  app.innerHTML = `
    <div class="progress" aria-hidden="true"><i style="width:${(i / PAIRS.length) * 100}%"></i></div>
    <div class="pair">
      <button class="option" type="button" data-pick="left" aria-label="${t("left")}: ${left.desc}">${left.draw()}<span class="key">← ${t("left")}</span></button>
      <button class="option" type="button" data-pick="right" aria-label="${t("right")}: ${right.desc}">${right.draw()}<span class="key">→ ${t("right")}</span></button>
    </div>
    <div class="row">
      <button class="btn" type="button" data-pick="both">${t("both")} (B)</button>
      <button class="btn" type="button" data-pick="neither">${t("neither")} (N)</button>
      <button class="btn" type="button" id="back" ${i === 0 ? "disabled" : ""}>${t("back")}</button>
    </div>`;
  app.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => choose(b.dataset.pick));
  document.getElementById("back").onclick = back;
}

function choose(pick) {
  const lowLeft = sides[i] === "L";
  let val = pick;
  if (pick === "left") val = lowLeft ? "low" : "high";
  if (pick === "right") val = lowLeft ? "high" : "low";
  answers[i] = { axis: PAIRS[i].axis, pick: val };
  i++;
  if (i >= PAIRS.length) renderResults(); else renderPair();
}

function back() { if (i > 0) { i--; renderPair(); } }

function vector() {
  const v = Object.fromEntries(AXES.map(a => [a, 5]));
  answers.forEach(a => { if (a.pick === "high") v[a.axis] += 2.5; if (a.pick === "low") v[a.axis] -= 2.5; });
  AXES.forEach(a => v[a] = Math.max(0, Math.min(10, Math.round(v[a]))));
  return v;
}

function renderResults() {
  const v = vector();
  const line = `axes: {${AXES.map(a => `${a}: ${v[a]}`).join(", ")}}`;
  const flat = AXES.map(a => `${a}=${v[a]}`).join(",");
  const raw = JSON.stringify(answers.map(a => [a.axis, a.pick]));
  count.textContent = `${PAIRS.length} ${t("of")} ${PAIRS.length}`;
  app.innerHTML = `
    <div class="results">
      <h2>${t("result")}</h2>
      ${AXES.map(a => `<div class="axis"><span class="label">${a}</span><div><div class="track"><b style="left:${v[a] * 10}%"></b></div><div class="ends"><span>${ENDS[lang][a][0]}</span><span>${ENDS[lang][a][1]}</span></div></div><span class="val">${v[a]}</span></div>`).join("")}
      <p class="hint" style="margin-top:24px">${t("paste")}</p>
      <pre id="out">${line}\nvector: ${flat}\nraw: ${raw}</pre>
      <div class="row">
        <button class="btn primary" type="button" id="copy">${t("copy")}</button>
        <button class="btn" type="button" id="again">${t("restart")}</button>
      </div>
    </div>`;
  document.getElementById("copy").onclick = async (e) => {
    const text = document.getElementById("out").textContent;
    try { await navigator.clipboard.writeText(text); e.target.textContent = t("copied"); }
    catch (err) { const r = document.createRange(); r.selectNodeContents(document.getElementById("out")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  };
  document.getElementById("again").onclick = () => { answers.length = 0; i = 0; renderPair(); };
}

document.addEventListener("keydown", e => {
  if (i < 0 || i >= PAIRS.length) return;
  if (e.key === "ArrowLeft") choose("left");
  else if (e.key === "ArrowRight") choose("right");
  else if (e.key.toLowerCase() === "b") choose("both");
  else if (e.key.toLowerCase() === "n") choose("neither");
  else if (e.key === "Backspace") { e.preventDefault(); back(); }
});

document.getElementById("lang").onclick = () => {
  lang = lang === "en" ? "az" : "en";
  try { localStorage.setItem("tt-lang", lang); } catch (e) {}
  applyLang();
  if (i < 0) renderIntro(); else if (i >= PAIRS.length) renderResults(); else renderPair();
};

applyLang();
renderIntro();
</script>
</body>
</html>
